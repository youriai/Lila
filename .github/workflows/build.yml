name: Engine Build Check

on:
  push:
    branches: ["master", "dev", "feat/*"]
  pull_request:
    branches: ["master", "dev"]
  workflow_dispatch:

jobs:
  sanitize:
    name: Sanitize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
            
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 xorg-dev libgl1-mesa-dev
          
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=DEBUG -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build Engine
        run: cmake --build build -- -j$(nproc)
      
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    needs: sanitize
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        config: [Debug, Release]
        compiler: [msvc, gcc, clang]
        exclude:
        - os: windows-2025-vs2026
          compiler: gcc
        - os: windows-2025-vs2026
          compiler: clang
        - os: ubuntu-24.04
          compiler: msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            sudo apt-get install -y g++-14
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
          
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSTRICT_MODE=ON

      - name: Build Engine (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config ${{ matrix.config }} -- -j$(nproc)

      - name: Build Engine (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.config }} -- /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: build/
