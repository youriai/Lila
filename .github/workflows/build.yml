name: Engine Build

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [Ubuntu-24.04, Windows-2025]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-14 xorg-dev libgl1-mesa-dev
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSTRICT_MODE=ON

      - name: Build Engine
        run: cmake --build build --config ${{ matrix.config }}
